<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>แดชบอร์ด ERP — ตัวอย่าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ================= TOKENS — LIGHT (bare :root) ================= */
:root {
  color-scheme: light;
  --green-50:#E9F8F1; --green-100:#C9EEDD; --green-200:#97E0C2; --green-300:#5FCEA4; --green-400:#30B987;
  --green-500:#1FA971; --green-600:#15885B; --green-700:#126B49; --green-800:#0E5238; --green-900:#0E3B2E; --green-950:#082619;
  --amber-50:#FEF6E7; --amber-100:#FDE9C2; --amber-300:#F9BC4D; --amber-500:#F59E0B; --amber-600:#D97D06; --amber-800:#92490E;
  --n-0:#FFFFFF; --n-50:#F6F8F7; --n-100:#EDF1EF; --n-200:#DEE5E2; --n-300:#C6D0CC; --n-400:#94A29D; --n-500:#69776F;
  --n-600:#4C5953; --n-700:#36423D; --n-800:#222B27; --n-900:#141A17;

  --font-sans:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Noto Sans Thai","Leelawadee UI",Thonburi,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --t-h2:27px; --t-h3:21px; --t-lg:18px; --t-base:16px; --t-sm:14px; --t-xs:12px; --t-2xs:11px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:11px; --r-xl:14px; --r-full:999px;
  --ease:cubic-bezier(0.25,0.46,0.45,0.94);

  --bg-app:#F6F8F7; --bg-surface:#FFFFFF; --bg-raised:#FFFFFF; --bg-sunken:#EDF1EF;
  --border:#DEE5E2; --border-strong:#C6D0CC;
  --text-strong:#141A17; --text:#222B27; --text-muted:#5F6D66; --text-faint:#94A29D;
  --brand-int:#1FA971; --brand-int-hover:#15885B; --accent:#F59E0B;
  --focus-ring:rgba(31,169,113,.45);
  --link:#126B49;

  /* Primary button = the real --brand-int fill (#1FA971). The real app sets white text on it (3.0:1, below the
     4.5:1 floor), so the mockup uses the app's own dark on-brand ink (#04140D, 6.3:1) and a lighter hover
     (green-400, 7.6:1) instead of the real darker hover (#15885B would drop the dark ink to 4.2:1). */
  --btn-primary-bg:#1FA971; --btn-primary-hover:#30B987; --btn-primary-fg:#04140D;
  --nav-active-bg:#E9F8F1; --nav-active-fg:#0E5238; --nav-hover-bg:#EDF1EF;
  --logo-grad:linear-gradient(160deg,#1FA971,#0E3B2E);
  --row-hover:#F3F7F5;

  /* Chips = the real Chip tones (chip.tsx). success/warning/danger/info text is the real token where it clears
     4.5:1 on its tint, otherwise the NEAREST step of the same hue that does (real: #16A34A 2.9:1, #F59E0B 1.9:1,
     #E5484D 3.4:1, #2A6FDB 4.2:1 on their own light tints). */
  --chip-neutral-bg:#EDF1EF; --chip-neutral-fg:#5F6D66;
  --chip-brand-bg:#E9F8F1;   --chip-brand-fg:#0E5238;
  --chip-accent-bg:#FEF6E7;  --chip-accent-fg:#92490E;
  --chip-success-bg:#E7F6ED; --chip-success-fg:#007F26;
  --chip-warning-bg:#FEF3E0; --chip-warning-fg:#AA5800;
  --chip-danger-bg:#FCEAEA;  --chip-danger-fg:#CA2C37;
  --chip-info-bg:#E8F0FC;    --chip-info-fg:#2267D2;
  --status-ok:#1FA971; --status-off:#E5484D;

  --series-1:#15885B; --series-2:#4a3aa7;
  --grid-line:#E6ECE9; --axis-line:#C6D0CC; --meter-track:#DDEFE6;
  /* Donut categorical slots: 4 identity slots + "อื่นๆ", fixed order. Validated as a set with dataviz
     validate_palette.js --mode light --surface #FFFFFF (adjacent AND --pairs all, because a donut sorted by value
     can put any two slices side by side): ALL CHECKS PASS, worst all-pairs CVD dE 10.9, normal-vision 17.6.
     Hues avoid green/violet (bar series); "อื่นๆ" is a muted bronze that still clears the chroma floor. */
  --cat-1:#235BC8; --cat-2:#E26500; --cat-3:#00A3B2; --cat-4:#902559; --cat-other:#7F5800;
  /* Status colours — reserved for the status donuts only (one per status-chip tone + "อื่นๆ"). Validated the same
     way (light, surface #FFFFFF, adjacent and --pairs all): ALL CHECKS PASS, worst all-pairs CVD dE 11.1,
     normal-vision 16.2. "ยังไม่อนุมัติ/รออนุมัติ" (neutral tone) is a slate blue, not gray, so it clears the chroma floor;
     icon + label in every legend row carry the meaning, never the colour alone. */
  --st-neutral:#5D95D1; --st-accent:#D07800; --st-brand:#00A877; --st-success:#027254; --st-danger:#C3220B; --st-other:#764F9D;

  --scrim:rgba(8,20,15,.5);
  --sh-lg:0 8px 20px rgba(8,38,25,.10),0 2px 5px rgba(8,38,25,.05);

  --demo-bg:#1E2430; --demo-fg:#ECEFF5; --demo-muted:#B9C0CE; --demo-line:rgba(255,255,255,.18); --demo-accent:#F9BC4D; --demo-panel:#262D3B;
}

/* ================= TOKENS — DARK (OS preference, unless user picked light) ================= */
/* Fidelity note: the active nav item (nav-links.tsx) and the brand/accent Chip tones (chip.tsx) use raw
   --green-50/--green-800 and --amber-50/--amber-800 in the real app, which are NOT re-themed for dark mode —
   so they are deliberately not redefined here either (light pills on the dark surface, as in production). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg-app:#0A0F0D; --bg-surface:#121916; --bg-raised:#18211D; --bg-sunken:#0D1411;
    --border:#243029; --border-strong:#324239;
    --text-strong:#F3F7F5; --text:#DCE5E0; --text-muted:#93A29B; --text-faint:#6B7A72;
    --brand-int:#2FC089; --brand-int-hover:#45CF9A; --accent:#FBB23E;
    --focus-ring:rgba(47,192,137,.5);
    --link:#6FE0B2;
    --btn-primary-bg:#2FC089; --btn-primary-hover:#45CF9A; --btn-primary-fg:#04140D;
    --nav-hover-bg:#18211D;
    --row-hover:#16201B;
    --chip-neutral-bg:#0D1411; --chip-neutral-fg:#93A29B;
    --chip-success-bg:rgba(22,163,74,.16); --chip-success-fg:#2DB056;
    --chip-warning-bg:rgba(245,158,11,.15); --chip-warning-fg:#F59E0B;
    --chip-danger-bg:rgba(229,72,77,.16);  --chip-danger-fg:#FD5E60;
    --chip-info-bg:rgba(42,111,219,.16);   --chip-info-fg:#4C92FF;
    --status-ok:#2FC089; --status-off:#FF6B6F;
    --series-1:#1FA971; --series-2:#9085e9;
    --grid-line:#1E2924; --axis-line:#324239; --meter-track:#1B2C24;
    /* donut sets re-validated --mode dark --surface #121916 (adjacent + --pairs all): ALL CHECKS PASS
       (cat: CVD dE 10.1 / normal 15.5; status: CVD dE 11.1 / normal 15.9). Same hues as light, re-stepped. */
    --cat-1:#006CD3; --cat-2:#E56900; --cat-3:#1AA1C9; --cat-4:#A34E72; --cat-other:#855E00;
    --st-neutral:#5B93CF; --st-accent:#CE7700; --st-brand:#00A878; --st-success:#047355; --st-danger:#C4230C; --st-other:#7E57A6;
    --scrim:rgba(0,0,0,.62);
    --sh-lg:0 14px 32px rgba(0,0,0,.55);
    --demo-bg:#262D3B; --demo-fg:#ECEFF5; --demo-muted:#BCC3D1; --demo-line:rgba(255,255,255,.18); --demo-panel:#2F3747;
  }
}
/* ================= TOKENS — DARK (explicit toggle) ================= */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-app:#0A0F0D; --bg-surface:#121916; --bg-raised:#18211D; --bg-sunken:#0D1411;
  --border:#243029; --border-strong:#324239;
  --text-strong:#F3F7F5; --text:#DCE5E0; --text-muted:#93A29B; --text-faint:#6B7A72;
  --brand-int:#2FC089; --brand-int-hover:#45CF9A; --accent:#FBB23E;
  --focus-ring:rgba(47,192,137,.5);
  --link:#6FE0B2;
  --btn-primary-bg:#2FC089; --btn-primary-hover:#45CF9A; --btn-primary-fg:#04140D;
  --nav-hover-bg:#18211D;
  --row-hover:#16201B;
  --chip-neutral-bg:#0D1411; --chip-neutral-fg:#93A29B;
  --chip-success-bg:rgba(22,163,74,.16); --chip-success-fg:#2DB056;
  --chip-warning-bg:rgba(245,158,11,.15); --chip-warning-fg:#F59E0B;
  --chip-danger-bg:rgba(229,72,77,.16);  --chip-danger-fg:#FD5E60;
  --chip-info-bg:rgba(42,111,219,.16);   --chip-info-fg:#4C92FF;
  --status-ok:#2FC089; --status-off:#FF6B6F;
  --series-1:#1FA971; --series-2:#9085e9;
  --grid-line:#1E2924; --axis-line:#324239; --meter-track:#1B2C24;
  --cat-1:#006CD3; --cat-2:#E56900; --cat-3:#1AA1C9; --cat-4:#A34E72; --cat-other:#855E00;
  --st-neutral:#5B93CF; --st-accent:#CE7700; --st-brand:#00A878; --st-success:#047355; --st-danger:#C4230C; --st-other:#7E57A6;
  --scrim:rgba(0,0,0,.62);
  --sh-lg:0 14px 32px rgba(0,0,0,.55);
  --demo-bg:#262D3B; --demo-fg:#ECEFF5; --demo-muted:#BCC3D1; --demo-line:rgba(255,255,255,.18); --demo-panel:#2F3747;
}

/* ================= BASE ================= */
*,*::before,*::after { box-sizing:border-box; }
body {
  margin:0; background:var(--bg-app); color:var(--text);
  font-family:var(--font-sans); font-size:var(--t-base); line-height:1.62; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
h1,h2,h3,p,ul,ol,dl,dd,figure { margin:0; }
ul,ol { padding:0; }
button,select,input { font:inherit; letter-spacing:inherit; color:inherit; }
a { color:inherit; text-decoration:none; }
svg { flex-shrink:0; }
.mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:0; }
.muted { color:var(--text-muted); }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
:focus-visible { outline:none; box-shadow:0 0 0 4px var(--focus-ring); border-radius:var(--r-sm); }
.th { word-break:break-word; line-break:loose; }
</style>
<style>
/* ================= DEMO STRIP (not product UI) ================= */
.demo { background:var(--demo-bg); color:var(--demo-fg); font-size:13px; line-height:1.5; padding:8px 16px 10px; border-bottom:1px solid var(--demo-line); }
.demo-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; }
.demo-badge { font-size:11px; font-weight:600; letter-spacing:.04em; padding:1px 8px; border-radius:var(--r-xs); background:var(--demo-accent); color:#2A1500; }
.demo-note { color:var(--demo-fg); }
.demo-toggle { display:none; margin-left:auto; background:transparent; border:1px solid var(--demo-line); color:var(--demo-fg); border-radius:var(--r-sm); padding:3px 10px; min-height:32px; cursor:pointer; }
.demo-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; margin-top:8px; }
.dgroup { display:inline-flex; align-items:center; gap:8px; color:var(--demo-muted); }
.dseg { display:inline-flex; border:1px solid var(--demo-line); border-radius:var(--r-sm); overflow:hidden; }
.dseg button { background:transparent; color:var(--demo-fg); border:0; padding:3px 10px; min-height:30px; cursor:pointer; }
.dseg button + button { border-left:1px solid var(--demo-line); }
.dseg button[aria-pressed="true"] { background:var(--demo-fg); color:var(--demo-bg); font-weight:600; }
.dgroup select { background:var(--demo-bg); color:var(--demo-fg); border:1px solid var(--demo-line); border-radius:var(--r-sm); padding:3px 8px; min-height:30px; }
.dchk { display:inline-flex; align-items:center; gap:6px; color:var(--demo-fg); cursor:pointer; }
.dchk input { width:16px; height:16px; accent-color:var(--demo-accent); margin:0; }
.demo-q { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:8px; }
.dq-btn { display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--demo-accent); color:var(--demo-accent); border-radius:var(--r-full); padding:1px 10px; min-height:28px; cursor:pointer; font-size:12.5px; }
.dq-line { color:var(--demo-muted); }
.dq-line b { color:var(--demo-fg); font-weight:600; }
.dq-phone { display:none; }
.q-panel { margin-top:8px; padding:10px 14px 10px 30px; border:1px solid var(--demo-line); border-radius:var(--r-md); background:var(--demo-panel); }
.q-panel ol { display:flex; flex-direction:column; gap:4px; }
.q-panel li { color:var(--demo-fg); }
.q-panel li span { color:var(--demo-muted); }
.demo :focus-visible { box-shadow:0 0 0 3px var(--demo-accent); }

/* ================= APP SHELL ================= */
.app { display:grid; grid-template-columns:216px minmax(0,1fr); min-height:100vh; }
.app.sb-collapsed { grid-template-columns:minmax(0,1fr); }
.app.sb-collapsed .sidebar { display:none; }
.sidebar {
  position:sticky; top:env(safe-area-inset-top,0px); align-self:start; height:100vh; height:100dvh;
  width:216px; display:flex; flex-direction:column; border-right:1px solid var(--border); background:var(--bg-surface); z-index:45;
}
.logo { display:flex; align-items:center; gap:12px; padding:16px 20px; }
.logo-mark { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:var(--r-md); background:var(--logo-grad); color:#fff; font-weight:700; font-size:18px; }
.logo-text { font-size:16px; font-weight:600; color:var(--text-strong); }
.snav { flex:1; overflow-y:auto; padding:8px 12px; display:flex; flex-direction:column; gap:20px; }
.sgroup { display:flex; flex-direction:column; gap:4px; }
.sgroup-label { padding:0 12px; font-size:var(--t-2xs); font-weight:500; letter-spacing:.04em; color:var(--text-muted); }
.sitem { display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; text-align:left; cursor:pointer;
  border-radius:var(--r-md); padding:8px 12px; font-size:var(--t-sm); color:var(--text-muted); transition:background .1s var(--ease),color .1s var(--ease); }
.sitem:hover { background:var(--nav-hover-bg); color:var(--text); }
.sitem[aria-current="page"] { background:var(--nav-active-bg); color:var(--nav-active-fg); font-weight:500; }
.suser { border-top:1px solid var(--border); padding:12px; }
.suser-row { display:flex; align-items:center; gap:12px; padding:8px; }
.avatar { width:32px; height:32px; border-radius:var(--r-full); display:flex; align-items:center; justify-content:center; background:var(--chip-brand-bg); color:var(--chip-brand-fg); font-size:14px; font-weight:600; }
.suser-name { font-size:var(--t-sm); font-weight:500; color:var(--text); line-height:1.2; }
.suser-role { font-size:var(--t-xs); color:var(--text-muted); line-height:1.3; }
.logout { width:100%; display:flex; align-items:center; gap:8px; border:0; background:none; border-radius:var(--r-md); padding:8px 12px; text-align:left; font-size:var(--t-sm); color:var(--chip-danger-fg); cursor:pointer; }
.logout:hover { background:var(--chip-danger-bg); }
.backdrop { position:fixed; inset:0; background:var(--scrim); z-index:44; }

.main-col { min-width:0; display:flex; flex-direction:column; }
.topbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:30; height:62px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  border-bottom:1px solid var(--border); background:var(--bg-surface); padding:0 24px; }
.topbar-left, .topbar-right { display:flex; align-items:center; gap:8px; min-width:0; }
.topbar h1 { font-size:var(--t-lg); font-weight:600; color:var(--text-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon-btn { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; border:0; background:none; border-radius:var(--r-md); color:var(--text-muted); cursor:pointer; transition:background .1s var(--ease),color .1s var(--ease); }
.icon-btn:hover { background:var(--bg-sunken); color:var(--text); }
.lang-btn { height:36px; padding:0 12px; border:0; background:none; border-radius:var(--r-md); font-size:var(--t-sm); font-weight:500; color:var(--text-muted); cursor:pointer; }
.lang-btn:hover { background:var(--bg-sunken); color:var(--text); }
main { padding:24px; flex:1; min-width:0; }
.page { max-width:1400px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }

.tabbar { display:none; position:fixed; left:0; right:0; bottom:0; z-index:40; border-top:1px solid var(--border); background:var(--bg-surface);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px)); }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:48px; border:0; background:none;
  border-radius:var(--r-md); font-size:var(--t-2xs); font-weight:600; color:var(--text-muted); cursor:pointer; }

/* tablet: sidebar becomes a drawer */
@media (max-width:1023px) {
  .app, .app.sb-collapsed { grid-template-columns:minmax(0,1fr); }
  .app.sb-collapsed .sidebar { display:flex; }
  .sidebar { position:fixed; top:0; bottom:0; left:0; align-self:stretch; height:100vh; height:100dvh; transform:translateX(-100%); transition:transform .18s var(--ease); box-shadow:none; }
  .app.drawer-open .sidebar { transform:none; box-shadow:var(--sh-lg); }
}
/* phone: no sidebar, no hamburger, bottom tab bar */
@media (max-width:767px) {
  .sidebar, .backdrop, .hamb, .lang-btn { display:none !important; }
  .tabbar { display:flex; }
  .topbar { padding:0 16px; }
  main { padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px)); }
  .demo-toggle { display:inline-flex; }
  .demo:not(.open) .demo-controls { display:none; }
  .dq-phone { display:inline; }
  .dq-line.desk { display:none; }
  /* demo-harness controls: same 44px touch floor as the product controls */
  .demo-toggle, .dseg button, .dgroup select, .dq-btn { min-height:44px; }
  .dseg button { padding:0 12px; }
  .dchk { min-height:44px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition:none !important; animation:none !important; }
}
</style>
<style>
/* ================= PRIMITIVES ================= */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:var(--r-md); font-weight:500; border:0; cursor:pointer; white-space:nowrap;
  transition:background .1s var(--ease),box-shadow .1s var(--ease),color .1s var(--ease); }
.btn:active { transform:translateY(1px); }
.btn-md { height:40px; padding:0 16px; font-size:var(--t-base); }
.btn-sm { height:34px; padding:0 12px; font-size:var(--t-sm); }
.btn-primary { background:var(--btn-primary-bg); color:var(--btn-primary-fg); }
.btn-primary:hover { background:var(--btn-primary-hover); }
.btn-secondary { background:var(--bg-surface); color:var(--text); border:1.5px solid var(--border-strong); }
.btn-secondary:hover { background:var(--bg-sunken); }
.field { height:36px; border-radius:var(--r-md); border:1px solid var(--border-strong); background:var(--bg-surface); padding:0 10px; font-size:var(--t-sm); color:var(--text);
  transition:box-shadow .1s var(--ease),border-color .1s var(--ease); max-width:100%; }
.field:focus-visible { border-color:var(--brand-int); }
.link { color:var(--link); font-weight:500; text-decoration:underline; text-decoration-color:transparent; text-underline-offset:3px; transition:text-decoration-color .1s var(--ease); }
.link:hover { text-decoration-color:currentColor; }

.chip { display:inline-flex; align-items:center; gap:4px; border-radius:var(--r-full); padding:1px 9px 1px 7px; font-size:var(--t-xs); font-weight:500; line-height:1.6; white-space:nowrap; }
.chip svg { width:12px; height:12px; }
.chip-neutral { background:var(--chip-neutral-bg); color:var(--chip-neutral-fg); }
.chip-brand { background:var(--chip-brand-bg); color:var(--chip-brand-fg); }
.chip-accent { background:var(--chip-accent-bg); color:var(--chip-accent-fg); }
.chip-success { background:var(--chip-success-bg); color:var(--chip-success-fg); }
.chip-warning { background:var(--chip-warning-bg); color:var(--chip-warning-fg); }
.chip-danger { background:var(--chip-danger-bg); color:var(--chip-danger-fg); }
.chip-info { background:var(--chip-info-bg); color:var(--chip-info-fg); }
.chips { display:inline-flex; flex-wrap:wrap; gap:4px 6px; align-items:center; }

.card { border-radius:var(--r-lg); border:1px solid var(--border); background:var(--bg-surface); }

/* ================= BANNERS ================= */
.banner { display:flex; align-items:flex-start; gap:10px; border-radius:var(--r-md); padding:10px 14px; font-size:var(--t-sm); line-height:1.55; }
.banner svg { margin-top:2px; }
.banner b { font-weight:600; }
.banner-info { background:var(--chip-info-bg); color:var(--chip-info-fg); }
.banner-warning { background:var(--chip-warning-bg); color:var(--chip-warning-fg); }
.src { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:var(--t-xs); color:var(--text-muted); }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
.dot.ok { background:var(--status-ok); box-shadow:0 0 0 3px rgba(31,169,113,.2); }
.dot.off { background:var(--status-off); box-shadow:0 0 0 3px rgba(229,72,77,.2); }

/* ================= FILTER BAR ================= */
.filters { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:12px 14px; }
.fgroup { display:inline-flex; align-items:center; gap:8px; font-size:var(--t-sm); color:var(--text-muted); }
.fgroup label, .fgroup .flabel { white-space:nowrap; }
/* Period-granularity segmented control — same 36px height and border as .field so it sits level with the
   selects beside it in the filter bar; the pressed segment reuses the brand chip pair (4.5:1+ in both themes)
   instead of a saturated fill, so it reads as "selected" without competing with the primary button. */
.fseg { display:inline-flex; border:1px solid var(--border-strong); border-radius:var(--r-md); background:var(--bg-surface); overflow:hidden; }
.fseg button { height:36px; padding:0 13px; border:0; background:transparent; font:inherit; font-size:var(--t-sm); color:var(--text-muted);
  cursor:pointer; white-space:nowrap; transition:background .1s var(--ease),color .1s var(--ease); }
.fseg button + button { border-left:1px solid var(--border-strong); }
.fseg button:hover { background:var(--row-hover); color:var(--text); }
.fseg button[aria-pressed="true"] { background:var(--chip-brand-bg); color:var(--chip-brand-fg); font-weight:600; }
.fdates input[type="date"] { width:148px; }
.be-label { font-size:var(--t-xs); color:var(--text-muted); white-space:nowrap; }
.be-label .mono { color:var(--text); }
.fchip { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 4px 0 12px; border-radius:var(--r-full); background:var(--chip-brand-bg); color:var(--chip-brand-fg); font-size:var(--t-sm); font-weight:500; }
.fchip a { width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--r-full); }
.fchip a:hover { background:rgba(0,0,0,.06); }
.freset { font-size:var(--t-sm); margin-left:auto; }
@media (max-width:767px) {
  .filters { gap:10px; }
  .fgroup, .fdates { display:grid; grid-template-columns:86px minmax(0,1fr); gap:8px 10px; width:100%; }
  .fgroup .field, .fdates input[type="date"] { width:100%; min-width:0; }
  .fseg { width:100%; }
  .fseg button { flex:1; min-height:44px; padding:0 6px; }
  .be-label { width:100%; padding-left:96px; }
  .freset { margin-left:96px; }
}

/* ================= KPI TILES ================= */
.kpis { display:flex; flex-wrap:wrap; gap:12px; }
.kpi { flex:1 1 200px; border-radius:var(--r-lg); border:1px solid var(--border); background:var(--bg-surface); padding:16px 18px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.kpi.wide { flex:2 1 360px; }
.kpi-label { font-size:var(--t-xs); color:var(--text-muted); font-weight:500; }
/* KPI numbers follow the design system's KPI recipe (design-spec §5, /summary): IBM Plex Mono */
.kpi-value { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:var(--t-h2); font-weight:600; line-height:1.2; color:var(--text-strong); letter-spacing:0; }
.kpi-value small { font-family:var(--font-sans); font-size:var(--t-sm); font-weight:500; color:var(--text-muted); margin-left:6px; letter-spacing:.01em; }
.kpi-sub { font-size:var(--t-xs); color:var(--text-muted); }
/* Real figures are six digits with a Thai unit ("140,558 กล่อง"), so the list drops to one column
   rather than clipping — two columns only survive when the tile is genuinely wide enough. */
.kpi-units { list-style:none; display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr)); gap:2px 16px; }
.kpi-units li { display:flex; align-items:baseline; gap:6px; min-width:0; }
.kpi-units li.more { grid-column:1 / -1; }
.kpi-units li.more .u { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kpi-units .v { font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:0; font-size:var(--t-lg); font-weight:600; color:var(--text-strong); }
.kpi-units .u { font-size:var(--t-sm); color:var(--text-muted); }
.meter { height:6px; border-radius:var(--r-full); background:var(--meter-track); overflow:hidden; margin-top:2px; }
.meter span { display:block; height:100%; border-radius:var(--r-full); background:var(--series-1); min-width:3px; }
.footnote { font-size:var(--t-xs); color:var(--text-muted); line-height:1.55; border-top:1px solid var(--border); padding-top:8px; margin-top:4px; }
.lock-hint { display:flex; align-items:center; gap:6px; font-size:var(--t-xs); color:var(--text-muted); }
@media (max-width:640px) { .kpi, .kpi.wide { flex-basis:100%; } }

/* ================= CHART CARD ================= */
.chart-card { padding:18px 20px 16px; display:flex; flex-direction:column; gap:14px; min-width:0; }
.card-head { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:8px 12px; }
.card-head h2 { font-size:var(--t-base); font-weight:600; color:var(--text-strong); line-height:1.4; }
.card-head > div:first-child { flex:1 1 220px; min-width:0; }
.card-sub { font-size:var(--t-xs); color:var(--text-muted); margin-top:2px; }
.legend { list-style:none; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:var(--t-xs); color:var(--text-muted); }
.legend li { display:inline-flex; align-items:center; gap:6px; }
.sw { width:10px; height:10px; border-radius:2px; display:inline-block; }
.s1 { background:var(--series-1); } .s2 { background:var(--series-2); }
.subchart { border-top:1px solid var(--border); padding-top:14px; display:flex; flex-direction:column; gap:10px; }
.subchart h3 { font-size:var(--t-sm); font-weight:600; color:var(--text-strong); }
.scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* column chart */
/* --colw is only emitted for a 1-3 bucket series (see columnChart), and min-width:300px is the floor, so a
   single-bar year view lands at 300px instead of stretching across the whole card. */
.cc { --h:170px; min-width:300px; max-width:calc(var(--yw,48px) + var(--n) * var(--colw,100vw)); }
.cc-body { display:grid; grid-template-columns:var(--yw,48px) minmax(0,1fr); padding-top:22px; }
.cc-y { position:relative; height:var(--h); }
.cc-y span { position:absolute; right:10px; transform:translateY(50%); font-size:11px; color:var(--text-muted); font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:0; }
.cc-plot { position:relative; height:var(--h); border-bottom:1px solid var(--axis-line); }
.cc-grid i { position:absolute; left:0; right:0; height:0; border-top:1px solid var(--grid-line); }
.cc-cols { position:absolute; inset:0; display:flex; }
.cc-col { flex:1; position:relative; display:flex; align-items:flex-end; justify-content:center; border-radius:var(--r-sm); cursor:pointer; }
.cc-col:hover { background:var(--row-hover); }
.cc-bar { width:min(24px,46%); border-radius:4px 4px 0 0; background:var(--series-1); transition:opacity .1s var(--ease); }
.cc-col:hover .cc-bar, .cc-col:focus-visible .cc-bar { opacity:.78; }
.cc-cap { position:absolute; left:0; right:0; text-align:center; font-size:12px; font-weight:600; color:var(--text-strong); pointer-events:none; }
.cc-cap.zero { font-weight:500; color:var(--text-muted); }
/* a true zero gets a visible 2px tick on the baseline, so "0" never looks like "no data yet" */
.cc-zero { width:min(24px,46%); height:2px; border-radius:1px; background:var(--text-faint); }
.cc-x { display:grid; grid-template-columns:var(--yw,48px) repeat(var(--n),minmax(0,1fr)); margin-top:6px; font-size:11.5px; color:var(--text-muted); }
.cc-x span { text-align:center; white-space:nowrap; }
.cc-caption { font-size:var(--t-xs); color:var(--text-muted); text-align:center; margin-top:2px; }

/* horizontal bar chart */
.hb { position:relative; --lw:120px; --vw:112px; min-width:320px; }
.hb-grid { position:absolute; top:0; bottom:24px; left:calc(var(--lw) + 12px); right:var(--vw); pointer-events:none; }
.hb-grid i { position:absolute; top:0; bottom:0; width:0; border-left:1px solid var(--grid-line); }
.hb-grid i:first-child { border-left-color:var(--axis-line); }
.hb-rows { position:relative; display:flex; flex-direction:column; }
.hb-row { display:grid; grid-template-columns:var(--lw) minmax(0,1fr); column-gap:12px; align-items:center; padding:9px 0; border-radius:var(--r-sm); }
a.hb-row, .hb-row[tabindex] { cursor:pointer; }
a.hb-row:hover, .hb-row[tabindex]:hover { background:var(--row-hover); }
.hb-label { font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:6px; }
.hb-label small { display:block; font-size:11px; color:var(--text-muted); font-family:var(--font-mono); letter-spacing:0; }
.hb-track { position:relative; margin-right:var(--vw); display:flex; flex-direction:column; gap:2px; }
.hb-bar { position:relative; height:12px; }
.hb-bar b { display:block; height:12px; border-radius:0 4px 4px 0; transition:opacity .1s var(--ease); }
.hb-row:hover .hb-bar b, .hb-row:focus-visible .hb-bar b { opacity:.78; }
.hb-bar em { position:absolute; top:50%; transform:translateY(-50%); font-style:normal; font-size:12px; font-weight:500; color:var(--text-strong); white-space:nowrap; padding-left:8px; }
.hb-axis { position:relative; height:24px; margin-left:calc(var(--lw) + 12px); margin-right:var(--vw); }
.hb-axis span { position:absolute; top:4px; transform:translateX(-50%); font-size:11px; color:var(--text-muted); white-space:nowrap; font-family:var(--font-mono); letter-spacing:0; }
.hb-axis span:first-child { transform:none; }
.supplier-list { list-style:none; display:flex; flex-direction:column; }
.supplier-list a { font-size:var(--t-sm); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 8px; border-bottom:1px solid var(--border); border-radius:var(--r-sm); }
.supplier-list li:last-child a { border-bottom:0; }
.supplier-list a:hover { background:var(--row-hover); }
.chart-empty { padding:28px 12px; text-align:center; font-size:var(--t-sm); color:var(--text-muted); }

/* ================= VIZ GRID: bar/trend chart beside its donut(s) ================= */
.viz-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:stretch; }
@media (min-width:1024px) {
  .viz-grid { grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); }
  .viz-grid.main-span > .chart-card:first-child { grid-row:span 2; }
}
/* only real plots stretch to the row; a plain list (STAFF purchase) keeps its natural height */
.viz-grid > .chart-card:not(:has(.grow)) { align-self:start; }
/* a main chart stretched to its row grows its plot instead of leaving a gap */
.chart-card > .grow { flex:1; display:flex; flex-direction:column; }
.grow > .cc { flex:1; display:flex; flex-direction:column; }
.grow > .cc > .cc-body { flex:1; grid-template-rows:minmax(var(--h),1fr); }
.grow > .cc .cc-y, .grow > .cc .cc-plot { height:auto; }
.grow > .hb { flex:1; display:flex; flex-direction:column; }
.grow > .hb > .hb-rows { flex:1; justify-content:space-around; }

/* ================= DONUT ================= */
.dn-body { container-type:inline-size; }
.dn-inner { display:flex; flex-direction:column; align-items:center; gap:14px; }
@container (min-width:440px) { .dn-inner { flex-direction:row; align-items:center; gap:16px; } .dn-fig { width:190px; } .dn-legend { flex:1; max-width:420px; } }
.dn-fig { position:relative; width:220px; max-width:100%; flex-shrink:0; }
.dn-fig svg { display:block; width:100%; height:auto; overflow:visible; }
.dn-seg path { transition:opacity .1s var(--ease); }
/* only a filtering slice (an <a>) looks clickable; a focus-only <g role="img"> (e.g. the "อื่นๆ" slice) does not */
.dn-seg { cursor:default; outline:none; }
a.dn-seg { cursor:pointer; }
.dn-seg.is-dim path, .dn-seg.hot-dim path { opacity:.32; }
.dn-seg:focus-visible path, .dn-seg.is-hot path { opacity:1; }
.dn-seg:focus-visible .dn-ring { stroke:var(--text-strong); stroke-width:2; }
.dn-ring { fill:none; stroke:transparent; }
.dn-gap { stroke:var(--bg-surface); stroke-width:2; pointer-events:none; }
.dn-track { fill:var(--grid-line); }
.dn-pct { font-family:var(--font-mono); font-size:14px; font-weight:500; fill:var(--text); pointer-events:none; }
.dn-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; padding:0 58px; }
/* a standalone hero number: proportional figures (tabular-nums only where digits align in columns) */
.dn-center b { font-family:var(--font-mono); font-size:22px; font-weight:600; line-height:1.15; color:var(--text-strong); letter-spacing:0; }
.dn-center span { font-size:11.5px; line-height:1.35; color:var(--text-muted); }
.dn-legend { list-style:none; display:flex; flex-direction:column; gap:2px; width:100%; min-width:0; }
.lg-row { display:grid; grid-template-columns:12px auto minmax(5.5em,1fr) auto 3.6em; align-items:center; column-gap:8px; min-height:36px; padding:4px 8px;
  border-radius:var(--r-md); font-size:var(--t-sm); color:var(--text); cursor:pointer; transition:background .1s var(--ease),opacity .1s var(--ease); }
.lg-row.no-icon { grid-template-columns:12px minmax(5.5em,1fr) auto 3.6em; }
a.lg-row:hover, .lg-row.is-hot { background:var(--row-hover); }
.lg-row[aria-current="true"] { background:var(--nav-hover-bg); box-shadow:inset 0 0 0 1.5px var(--border-strong); font-weight:600; }
/* dimming touches only the colour key — legend text keeps full contrast */
.lg-row.is-dim .lg-key, .lg-row.hot-dim .lg-key { opacity:.35; }
.lg-row.static { cursor:default; }
.lg-key { width:12px; height:12px; border-radius:3px; background:var(--c); }
.lg-ico { display:inline-flex; color:var(--text-muted); }
.lg-label { min-width:0; line-height:1.35; }
/* real supplier/category names are long — one ellipsised line, full text in title= */
.lg-name { display:block; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lg-sub { display:block; font-size:var(--t-xs); color:var(--text-muted); font-family:var(--font-mono); letter-spacing:0; font-weight:400; }
.lg-members { display:block; font-size:var(--t-xs); color:var(--text-muted); font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lg-val { font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:0; text-align:right; white-space:nowrap; color:var(--text-strong); }
.lg-pct { font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:0; text-align:right; color:var(--text-muted); font-size:13px; }
.dn-foot { display:flex; flex-direction:column; gap:6px; }
.n-note { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-size:var(--t-xs); color:var(--text-muted); }
.n-note .chip { font-family:var(--font-mono); letter-spacing:0; }
@media (max-width:767px) { .lg-row { min-height:44px; } }

/* ================= TABLES ================= */
.section-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; margin-top:4px; }
.section-head h2 { font-size:var(--t-base); font-weight:600; color:var(--text-strong); }
.grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; align-items:start; }
@media (max-width:1199px) { .grid-2 { grid-template-columns:minmax(0,1fr); } }
.tcard { min-width:0; overflow:hidden; }
.tcard-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; padding:14px 16px; border-bottom:1px solid var(--border); }
.tcard-head h2, .tcard-head h3 { font-size:var(--t-base); font-weight:600; color:var(--text-strong); }
.tcard-head .count { font-size:var(--t-xs); color:var(--text-muted); font-weight:400; margin-left:6px; }
.tcard-note { display:flex; align-items:center; gap:6px; padding:8px 16px; font-size:var(--t-xs); color:var(--text-muted); background:var(--bg-sunken); border-bottom:1px solid var(--border); }
.tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.tbl { width:100%; border-collapse:collapse; font-size:var(--t-sm); }
.tbl thead tr { background:var(--bg-sunken); border-bottom:1px solid var(--border); }
.tbl th { padding:9px 12px; font-weight:500; color:var(--text-muted); text-align:left; white-space:nowrap; font-size:13px; }
.tbl th.right, .tbl td.right { text-align:right; }
.th-sort { display:inline-flex; align-items:center; gap:4px; color:inherit; border-radius:var(--r-xs); padding:2px 2px; }
.th-sort:hover { color:var(--text); }
.th-sort svg { opacity:.55; }
th[aria-sort="ascending"] .th-sort, th[aria-sort="descending"] .th-sort { color:var(--text-strong); }
th[aria-sort="ascending"] .th-sort svg, th[aria-sort="descending"] .th-sort svg { opacity:1; }
.tbl tbody tr { border-bottom:1px solid var(--border); }
.tbl tbody tr:last-child { border-bottom:0; }
.tbl td { padding:10px 12px; color:var(--text); vertical-align:top; }
.tbl tr.clickable { cursor:pointer; transition:background .1s var(--ease); }
.tbl tr.clickable:hover { background:var(--row-hover); }
.tbl td.num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:0; white-space:nowrap; }
.sub { display:block; font-size:var(--t-xs); color:var(--text-muted); font-family:var(--font-mono); letter-spacing:0; }
/* Real ERP names run to 50+ Thai characters. Clamp them to the cell, keep the full string in title=.
   The clamp is a max-width, not a fixed one, so short names still shrink-to-fit. */
.trunc { display:block; max-width:26ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tbl td .trunc { max-width:30ch; }
.mrow-title .trunc, .mrow-fields .trunc { max-width:100%; }
.supplier-list .trunc { max-width:22ch; }
.stack { display:flex; flex-direction:column; gap:2px; }
.nil { color:var(--text-muted); }
.not-yet { color:var(--text-muted); font-size:13px; }
.mlist { display:none; list-style:none; }
.msort { display:none; }
.pager { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; padding:10px 16px; border-top:1px solid var(--border); font-size:var(--t-xs); color:var(--text-muted); }
.pager nav { display:flex; align-items:center; gap:4px; }
.pg-status { display:none; font-size:var(--t-sm); color:var(--text); padding:0 6px; white-space:nowrap; }
.pg { min-width:34px; height:34px; padding:0 8px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--r-md); border:1px solid var(--border); background:var(--bg-surface); color:var(--text); font-size:var(--t-sm); font-family:var(--font-mono); }
a.pg:hover { background:var(--bg-sunken); }
.pg[aria-current="page"] { background:var(--btn-primary-bg); border-color:var(--btn-primary-bg); color:var(--btn-primary-fg); font-weight:600; }
.pg[aria-disabled="true"] { opacity:.45; }
/* 135 real products = 14 pages: the strip is windowed, so it never outgrows a half-width card */
.pg-gap { border-color:transparent; background:none; min-width:18px; padding:0 2px; color:var(--text-muted); }
.empty { display:flex; flex-direction:column; align-items:center; gap:8px; padding:36px 16px; text-align:center; color:var(--text-muted); font-size:var(--t-sm); }
.empty svg { color:var(--text-faint); }
.empty p { color:var(--text); font-weight:500; }

/* grouped rows (one <tbody> per record, one <tr> per unit) — number and unit share a row */
.tbl-groups tbody { border-bottom:1px solid var(--border); }
.tbl-groups tbody:last-child { border-bottom:0; }
.tbl-groups tbody tr { border-bottom:0; }
.tbl-groups tbody tr + tr td { padding-top:0; }
.tbl-groups tbody tr:not(:last-child) td:not([rowspan]) { padding-bottom:4px; }
.tbl-groups tbody.clickable { cursor:pointer; transition:background .1s var(--ease); }
.tbl-groups tbody.clickable:hover { background:var(--row-hover); }

/* phone: tables become card lists */
@media (max-width:767px) {
  .tbl-wrap.has-cards { display:none; }
  /* pagination: 44px targets; page numbers collapse to "หน้า x จาก n" so the row never overflows */
  .pager nav { gap:8px; }
  .pg { min-width:44px; height:44px; }
  .pg.pg-n { display:none; }
  .pg-status { display:inline-flex; }
  /* narrow horizontal-bar plots: keep only the end ticks so axis labels never collide (gridlines stay) */
  .hb-axis span:not(:first-child):not(:last-child) { display:none; }
  .mlist { display:block; }
  .msort { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border); font-size:var(--t-xs); color:var(--text-muted); }
  .msort select { flex:1; min-width:0; }
  .tcard-head { padding:12px 14px; }
}

function cmp(a, b) { return typeof a === "number" && typeof b === "number" ? a - b : String(a).localeCompare(String(b), "th"); }
const SORT_WORDS = { text: ["ก→ฮ", "ฮ→ก"], num: ["น้อย→มาก", "มาก→น้อย"], date: ["เก่า→ใหม่", "ใหม่→เก่า"] };
/* 135 real products = 14 pages. Printing every number overflows a half-width card, so the strip is
   windowed: first, an ellipsis, the current page and its neighbours, an ellipsis, last. Every page is
   still reachable in at most two clicks, and the "หน้า x จาก y" status is always there. */
function pageWindow(page, pages) {
  if (pages <= 7) { const a = []; for (let i = 1; i <= pages; i++) a.push(i); return a; }
  const keep = new Set([1, pages, page, page - 1, page + 1]);
  if (page <= 3) [2, 3, 4].forEach((i) => keep.add(i));
  if (page >= pages - 2) [pages - 3, pages - 2, pages - 1].forEach((i) => keep.add(i));
  const nums = [...keep].filter((i) => i >= 1 && i <= pages).sort((a, b) => a - b);
  const out = [];
  nums.forEach((i, k) => { if (k && i - nums[k - 1] > 1) out.push("gap"); out.push(i); });
  return out;
}
function tableCard(t) {

  const useCat = !!f.cat && skip !== "cat";

/* skip = the donut's own dimension ("sup" | "status"), see salesData() */
function purchaseData(skip) {
  const f = F();
  let pos = POS.filter((p) => p.date >= f.from && p.date <= f.to);
  if (f.sup && skip !== "sup") pos = pos.filter((p) => p.supplierCode === f.sup);
  if (f.status && skip !== "status") pos = pos.filter((p) => p.st === f.status);
  if (f.empty) pos = [];
  const active = pos.filter((p) => !p.cancelled);
  const keep = new Set(active.map((p) => p.poNo));
  /* Most real purchase invoices carry no purchase-order number, so an invoice counts when it is in
     range and either belongs to a kept PO or has no PO at all. The supplier filter applies to both;
     a PO-status filter can only apply to invoices that have a PO, so PO-less ones leave that view. */
  let invoices = INVOICES.filter((v) => v.invoiceDate >= f.from && v.invoiceDate <= f.to && (v.po ? keep.has(v.po.poNo) : true));
  if (f.sup && skip !== "sup") invoices = invoices.filter((v) => v.supplierCode === f.sup);
  if (f.status && skip !== "status") invoices = invoices.filter((v) => !!v.po);
  if (f.empty) invoices = [];
  return { f: f, pos: pos, active: active, invoices: invoices, orphans: invoices.filter((v) => !v.po) };
}

/* ADMIN only — invoice-basis baht per period ("ยอดซื้อตามช่วงเวลา" in the requirement list). The measure is

   granularity; the buckets come from the shared timeBins() builder, which tiles the selected range, and
   selfCheck asserts that sum for week/month/year. เดือน is the default because the ERP reports purchases by
   month, so that is the axis this figure gets reconciled against. Mirrors salesMoneyChart: an empty period
   still draws an explicit 0 rather than a gap. */
function purchaseBinChart(d) {
  const g = binDef(), title = "ยอดซื้อตามใบแจ้งหนี้ " + g.per;
  const bins = timeBins(d.f.from, d.f.to, binKey()).map((b) => {
    const vs = d.invoices.filter((v) => inBin(b, v.invoiceDate));
    return Object.assign({}, b, { amount: sum(vs, (v) => v.amount), count: vs.length });
  });
  const chartBins = bins.map((b) => ({
    label: b.label, value: b.amount,
    aria: b.full + ": " + (b.amount > 0 ? fmtM(b.amount) : "0 บาท — ไม่มีใบแจ้งหนี้ซื้อใน" + g.label + "นี้") + " จากใบแจ้งหนี้ " + fmtN(b.count) + " ใบ",
    tipId: tip({ title: b.full, rows: [{ value: fmtM(b.amount), label: "ยอดซื้อ (ตามใบแจ้งหนี้)", sw: "s1" }, { value: fmtN(b.count) + " ใบ", label: "ใบแจ้งหนี้ซื้อ", sw: "s2" }],

/* Supplier identity colours — fixed per supplier: the same in every filter state, for both roles and in both themes.
   Suppliers are ranked ONCE over the whole dataset by non-cancelled PO count (ties: code). The top 4 own
   --cat-1..--cat-4; every other supplier is always folded into "อื่นๆ" (--cat-other). So the donut never shows more
   than 5 slices and never references a --cat-N token that does not exist, however many suppliers the ERP has. */
const SUP_COLOR = (() => {
  const n = (code) => POS.filter((p) => !p.cancelled && p.supplierCode === code).length;
  const ranked = SUP_ORDER.slice().sort((a, b) => n(b) - n(a) || a.localeCompare(b));
  return Object.fromEntries(ranked.slice(0, 4).map((code, i) => [code, "var(--cat-" + (i + 1) + ")"]));
})();

  })).concat(rest.length ? [{ key: "other", label: "อื่นๆ", color: "var(--cat-other)", value: sum(rest, (m) => m.value), members: rest }] : []);

/* ----- tooltip (textContent only) ----- */
const tipEl = $("#tip");
let tipTarget = null;
function hideTip() { tipTarget = null; tipEl.hidden = true; }
function placeTip(x, y) {
  const r = tipEl.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;
  tipEl.style.left = Math.max(8, left) + "px";
  tipEl.style.top = Math.max(8, top) + "px";
}
function showTip(el, x, y) {
  const t = TIPS.get(el.dataset.tip);
  if (!t) return;
  tipTarget = el;
  tipEl.textContent = "";
  const title = document.createElement("div"); title.className = "tip-title"; title.textContent = t.title; tipEl.appendChild(title);
  t.rows.forEach((r) => {
    const row = document.createElement("div"); row.className = "tip-row";
    const key = document.createElement("i"); key.style.background = r.color || (r.sw ? "var(--series-" + r.sw.slice(1) + ")" : "transparent");
    const b = document.createElement("b"); b.textContent = r.value;
    const s = document.createElement("span"); s.textContent = r.label;
    row.append(key, b, s); tipEl.appendChild(row);
  });
  if (t.hint) { const h = document.createElement("div"); h.className = "tip-title"; h.style.margin = "6px 0 0"; h.textContent = t.hint; tipEl.appendChild(h); }
  tipEl.hidden = false;
  placeTip(x, y);
}
document.addEventListener("pointerover", (e) => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el && el !== tipTarget) showTip(el, e.clientX, e.clientY); });
/* donut: hovering/focusing a slice OR its legend row lifts that category in both places */
function donutHot(el, on) {
  const box = el && el.closest(".donut");
  if (!box) return;
  const key = on ? el.dataset.dn : null;
  box.querySelectorAll("[data-dn]").forEach((x) => { x.classList.toggle("is-hot", !!key && x.dataset.dn === key); x.classList.toggle("hot-dim", !!key && x.dataset.dn !== key); });
}
["pointerover", "focusin"].forEach((t) => document.addEventListener(t, (e) => { const el = e.target.closest && e.target.closest("[data-dn]"); if (el) donutHot(el, true); }));
["pointerout", "focusout"].forEach((t) => document.addEventListener(t, (e) => {
  const el = e.target.closest && e.target.closest("[data-dn]");
  if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) donutHot(el, false);
}));
document.addEventListener("pointermove", (e) => { if (tipTarget) placeTip(e.clientX, e.clientY); });
document.addEventListener("pointerout", (e) => { if (tipTarget && !(e.relatedTarget && tipTarget.contains(e.relatedTarget))) hideTip(); });
document.addEventListener("focusin", (e) => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top + 8); }
});
document.addEventListener("focusout", (e) => { if (tipTarget && e.target === tipTarget) hideTip(); });
window.addEventListener("scroll", () => { if (tipTarget && document.activeElement !== tipTarget) hideTip(); }, { passive: true });
